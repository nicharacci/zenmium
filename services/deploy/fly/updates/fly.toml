# zenmium-updates: Sparkle/WinSparkle appcast feed (upstream util/sparkler
# daemon + a Zenmium-owned static file server, two processes on one machine).
# Public: browser update checks fetch /appcast-<arch>.xml over the Fly edge.

app = "zenmium-updates"
primary_region = "iad"

[processes]
  app = "sh /app/run.sh"

[env]
  APPCAST_PUBLIC_DIR = "/srv/appcasts"
  ASSETS_DIR = "/srv/assets"
  # Repo whose releases sparkler turns into appcast entries. Placeholder points
  # at the upstream public repo so the feed produces a real appcast; flip to the
  # T3 releases repo (e.g. nicharacci/zenmium-macos) when it exists.
  GITHUB_REPO = "imputnet/helium-macos"
  # ED_PRIVATE_KEY: base64 Ed25519 private key for appcast signatures (secret).
  # GITHUB_ACCESS_TOKEN: optional but required in practice; the unauthed
  # 60/hr API rate limit is shared across the Fly egress IP (secret).
  # SERVE_ASSETS_LOCALLY = "yes"  # also mirror release binaries under /assets/

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.checks]]
    type = "http"
    port = 8080
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"
    protocol = "http"

[[vm]]
  # shared-cpu-1x caps at 2GB and OOMed mid-appcast; sparkler signs every
  # release's DMG concurrently (Promise.all over releases)
  size = "shared-cpu-2x"
  memory = "4gb"

[[mounts]]
  source = "sparkler_srv"
  destination = "/srv"
  # Persists the downloaded-asset cache and generated appcasts across
  # deploys/restarts; without it every boot re-downloads the whole
  # GITHUB_REPO release history (several GB).
