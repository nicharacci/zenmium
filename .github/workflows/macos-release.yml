name: Zenmium macOS release

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/macos-release.yml"
  workflow_dispatch:
  push:
    branches:
      - "2026-09-12"
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.8
      - name: Install
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Secret scan (source)
        working-directory: desktop
        run: pnpm security:scan
      - name: Typecheck
        working-directory: desktop
        run: pnpm typecheck
      - name: Build
        working-directory: desktop
        run: pnpm build
      - name: Unit tests
        working-directory: desktop
        run: pnpm test
      - name: Package (unsigned)
        working-directory: desktop
        run: pnpm exec electron-builder --mac --arm64
      - name: Secret scan (artifacts)
        working-directory: desktop
        run: pnpm security:scan:artifacts
      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Zenmium-macOS-${{ github.ref_name }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error
