name: browser-macos

on:
  push:
    paths:
      - 'browser/**'
      - 'platform/macos/**'
      - '.github/workflows/browser-macos.yml'
  pull_request:
    paths:
      - 'browser/**'
      - 'platform/macos/**'
      - '.github/workflows/browser-macos.yml'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64
          - x86_64

# Cap one build attempt per push batch: a newer push supersedes the in-flight build.
concurrency:
  group: browser-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Zenmium (macOS, ${{ matrix.arch }})
    runs-on: macos-15-xlarge
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify vendored helium-chromium link
        run: |
          test -e platform/macos/helium-chromium/patches/series || \
            (echo 'helium-chromium symlink did not survive checkout' && exit 1)

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install toolchain deps
        run: |
          brew install coreutils sccache
          pip3 install httplib2==0.22.0 requests pillow --break-system-packages

      - name: Prepare Xcode
        run: |
          sudo rm -rf "$ANDROID_HOME" || true
          sudo mdutil -a -i off || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | head -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode*.app | head -1)
          sudo xcode-select --switch "$XCODE"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Fetch Chromium sources
        run: |
          cd platform/macos
          mkdir -p build/download_cache
          ./retrieve_and_unpack_resource.sh -g ${{ matrix.arch }}

      - name: Dry-run every series patch (browser + platform)
        run: |
          set -euo pipefail
          cd platform/macos
          check_series() {
            local pdir="$1"
            grep -vE '^\s*(#|$)' "$pdir/series" | while read -r rel; do
              echo "checking $pdir/$rel"
              patch -p1 --ignore-whitespace --dry-run --fuzz=0 \
                -i "$pdir/$rel" -d build/src --no-backup-if-mismatch > /dev/null \
                || { echo "FAILED: $pdir/$rel"; exit 1; }
            done
          }
          check_series helium-chromium/patches
          check_series patches

      - name: Fetch toolchain + apply patches + substitutions
        run: |
          cd platform/macos
          source ./devutils/shared.sh
          python3 helium-chromium/utils/prune_binaries.py build/src helium-chromium/pruning.list
          ./retrieve_and_unpack_resource.sh -t ${{ matrix.arch }}
          python3 helium-chromium/utils/patches.py apply build/src helium-chromium/patches patches
          python3 helium-chromium/utils/domain_substitution.py apply \
            -r helium-chromium/domain_regex.list \
            -f helium-chromium/domain_substitution.list build/src
          python3 helium-chromium/utils/name_substitution.py --sub -t build/src
          python3 helium-chromium/utils/i18n_apply.py -t build/src
          python3 helium-chromium/utils/helium_version.py \
            --tree helium-chromium --platform-tree . --chromium-tree build/src
          helium_resources

      - name: gn gen (CI args)
        run: |
          cd platform/macos
          source ./devutils/shared.sh
          configure_build ${{ matrix.arch }} true false

      - name: Build chrome/installer/mac
        run: |
          cd platform/macos
          source ./devutils/shared.sh
          export SCCACHE_GHA_ENABLED=on SCCACHE_GHA_VERSION=${{ matrix.arch }}
          sccache --show-stats || true
          helium_build chrome/installer/mac
          sccache --show-stats || true

      - name: Sign (ad-hoc) + package DMG
        run: |
          cd platform/macos
          ./sign_and_package_app.sh

      - name: Launch smoke test
        run: |
          cd platform/macos
          DMG=$(ls build/zenmium_*_macos.dmg | head -1)
          hdiutil attach -nobrowse -mountpoint /tmp/zenmium_mnt "$DMG"
          cp -R "/tmp/zenmium_mnt/Zenmium.app" /tmp/
          hdiutil detach /tmp/zenmium_mnt
          spctl -a -vv /tmp/Zenmium.app || true
          /tmp/Zenmium.app/Contents/MacOS/Zenmium --version
          defaults read /tmp/Zenmium.app/Contents/Info CFBundleIdentifier
          defaults read /tmp/Zenmium.app/Contents/Info CFBundleShortVersionString

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenmium_macos_${{ matrix.arch }}
          path: platform/macos/build/zenmium_*_macos.dmg
          if-no-files-found: error
